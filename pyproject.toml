[project]
name = "analog-search"
version = "0.1.0"
description = "Поиск аналогов материалов и оборудования по истории закупок"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0",
    "pgvector>=0.5.1",
    "truststore>=0.10.5",
    "pyyaml>=6.0.3",
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
analog-search = "app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=8.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/domain", "src/infrastructure", "src/repositories", "src/services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL (docker compose up -d db)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",  # TestClient only, not the app
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["B", "I", "SIM", "RUF", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Russian domain text

[tool.mypy]
files = ["src"]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pgvector.*"]
ignore_missing_imports = true
