[project]
name = "analog-search"
version = "0.1.0"
description = "Поиск аналогов материалов и оборудования по истории закупок"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0",
    "pgvector>=0.5.1",
    "truststore>=0.10.5",
    "pyyaml>=6.0.3",
    "fastapi>=0.143.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
analog-search = "analog_search.app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analog_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL (docker compose up -d db)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",  # TestClient only, not the app
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["research/scripts"]

[tool.ruff.lint]
extend-select = ["B", "I", "SIM", "RUF", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Russian domain text
