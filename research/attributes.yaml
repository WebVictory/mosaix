версия: 1
статус_по_умолчанию: предложено
шкала_уровней:
  hard: "несовпадение исключает кандидата из аналогов (может быть показан как 'ближайший, не аналог')"
  soft: "несовпадение снижает оценку, кандидат остается"
  info: "показывается человеку, в оценке не участвует"
шкала_сравнения:
  равно: "значения должны совпасть после нормализации"
  не_хуже: "кандидат >= запроса по упорядоченному ряду или числу"
  не_больше: "кандидат <= запроса (например SDR)"
  ступень: "отличие не более допуск_ступеней шагов по ряду"
  включает: "свойство кандидата покрывает запрошенное (диапазон, набор функций, исполнение по порядку)"
  без_порядка: "многомерный размер сравнивается как отсортированный набор чисел"
шкала_уверенности: ["источник", "здравый смысл", "догадка"]
