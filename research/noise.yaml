версия: 1
примечание: "шаблоны - регулярные выражения по нормализованному тексту (нижний регистр, ё -> е); строк_в_базе посчитано по всей базе"
шумы:
  - имя: "или_аналог"
    шаблон: "или аналог|или эквивалент|по типу|\\(или анало"
    описание: "оговорка о допустимости аналога; удалить до разбора, но можно сохранить флаг 'аналог допускается'"
    действие: "удалить"
    строк_в_базе: 16
    пример:
      строка: 319
      текст: "Колодец стеклопластиковый канализационный с лотковой частью по типу Rainpark WL (или аналог), D1600мм, H=4000мм комплектно с горловиной D=600мм, лестницей, чугунным люком."
  - имя: "примечание_в_скобках"
    шаблон: "\\(прим\\.?"
    описание: "примечание с альтернативными параметрами; не смешивать с основными характеристиками, выносить в отдельное поле"
    действие: "вынести"
    строк_в_базе: 119
    пример:
      строка: 61
      текст: "Изделия сборные железобетонные лотковые водоотводных сооружений на автомобильных дорогах, блоки упора бетонные Б-9, размер 800x510x250 мм, объемом бетона 0,088 м3 с расходом стали класса А-I 1,76 кг, бетон марки 300 (прим. упор в колодце)"
  - имя: "в_комплекте"
    шаблон: "в комплекте|комплектно с|в составе:?|в составе"
    описание: "перечень состава; основное изделие стоит до этих слов"
    действие: "отсечь хвост для поиска, сохранить для отображения"
    строк_в_базе: 138
    пример:
      строка: 24
      текст: "Проверочное оборудование Omicron CMC 356 в составе:"
  - имя: "ссылка_на_гост_ту"
    шаблон: "гост\\s*[рp]?\\s*[\\d.-]+|\\bту\\s*[\\d.-]+"
    описание: "номер стандарта; не характеристика, но может уточнять тип изделия"
    действие: "удалить из текста для сравнения"
    строк_в_базе: 26
    пример:
      строка: 22
      текст: "Рукав напорно – всасывающий ГОСТ 5398-76 (Б- 2 - 38 – 5 (10м)) 250м"
  - имя: "имя_объекта"
    шаблон: "объект-[а-я]|гэс-\\d|пс\\s*\\d+\\s*кв|квл\\s*\\d+|вл\\s*\\d+\\s*кв"
    описание: "имя объекта и линии (КВЛ 220 кВ ГЭС-1 – Объект-А); числа здесь не характеристики изделия"
    действие: "удалить"
    строк_в_базе: 51
    пример:
      строка: 51
      текст: "Шкаф ДЗЛ и АУВ КВЛ 220 кВ Объект-А - Объект-Е"
  - имя: "единица_учета"
    шаблон: "\\(\\s*\\d+\\s*(?:шт|м|компл)\\.?\\s*\\)|\\bшт\\.?\\b|\\bкомпл\\.?\\b"
    описание: "количество и единица учета внутри наименования"
    действие: "удалить"
    строк_в_базе: 34
    пример:
      строка: 22
      текст: "Рукав напорно – всасывающий ГОСТ 5398-76 (Б- 2 - 38 – 5 (10м)) 250м"
  - имя: "служебные_слова"
    шаблон: "\\bтипа\\b|\\bмарки\\b|\\bмарка\\b|\\bисполнения\\b|\\bизделие\\b|\\bизделия\\b"
    описание: "служебные слова-связки"
    действие: "удалить"
    строк_в_базе: 102
    пример:
      строка: 48
      текст: "Фасонное изделие для ТСП (ПЭ-01-7004-0.5)"
  - имя: "тип_работ"
    шаблон: "монтаж|установка|прокладка|устройство"
    описание: "слова работ; в базе товаров встречаются в смешанных строках"
    действие: "проверять: если строка начинается с работы - это не товар"
    строк_в_базе: 99
    пример:
      строка: 36
      текст: "Муфта в комплекте с деталями для монтажа МОПГ-М-1/128-4КУ3260-К"
  - имя: "масса_вес"
    шаблон: "\\(\\s*[\\d.,]+\\s*(?:кг|т)\\s*\\)|масса\\s*[\\d.,]+"
    описание: "масса в скобках - справочно, не для сравнения"
    действие: "вынести в info"
    строк_в_базе: 9
    пример:
      строка: 129
      текст: "Приточная установка в комплекте с автоматикой Airbox F40-07Q (304 кг)"
  - имя: "расход_на_площадь"
    шаблон: "[\\d.,]+\\s*кг/м2"
    описание: "норма расхода материала из сметы, не свойство товара"
    действие: "вынести в info"
    строк_в_базе: 13
    пример:
      строка: 115
      текст: "Мастика битумно-полимерная гидроизоляционная, кровельная, для строительных конструкций и устройства (ремонта) кровли, холодная, готовая к применению, диапазон температур от -20 до +40 °С, прочность сцепления с металлом/бетоном не менее 0,9/0,6 МПа, расход для гидроизоляции/устройства кровли 2,5-3,5/3,8-5,7 кг/м2 при толщине слоя покрытия 2 мм (технониколь №24)"
  - имя: "кавычки_названия"
    шаблон: "[«»\\\"]"
    описание: "торговое название в кавычках; оставить как слово, кавычки убрать"
    действие: "нормализовать"
    строк_в_базе: 141
    пример:
      строка: 2
      текст: "Желоб водоприемный МП \"Модерн\""
  - имя: "латиница_вместо_кириллицы"
    шаблон: "[a-z](?=[а-я])|(?<=[а-я])[a-z]|\\bc[а-я]"
    описание: "смешение латиницы и кириллицы в одном слове (Cвыше, КПCВВ, нг(A))"
    действие: "заменить похожие латинские буквы на кириллицу в русских словах и наоборот в кодах"
    строк_в_базе: 49
    пример:
      строка: 31
      текст: "Шинная опора ШОП-35.II-УХЛ1, Uн=35 кВ комплектно с: опорной стойкой под три ШО Н=4550 мм"
  - имя: "опечатки"
    шаблон: "бронорован|кабел\\b|огнестойкий кабел"
    описание: "опечатки в наименовании"
    действие: "словарь исправлений"
    строк_в_базе: 4
    пример:
      строка: 104
      текст: "Кабель силовой ВБШвнг(А)-LS-0,66 4х2,5мм2 с медными жилами, бронорованный стальными лентами, изоляцией и защитным шлангом из ПВХ пониженной пожарной опасности."
  - имя: "доп_цвет"
    шаблон: "\\bбел(?:ый|ая|ое)\\b|\\bсер(?:ый|ая)\\b|\\bчерн(?:ый|ая)\\b|ral\\s*\\d{4}"
    описание: "цвет - обычно info"
    действие: "вынести в info"
    строк_в_базе: 40
    пример:
      строка: 108
      текст: "Герметик-клей полиуретановый однокомпонентный быстросохнущий высокоэластичный, устойчивый к перепаду температур, для уплотнения и герметизации внутренних и наружных швов и стыков, белый и цветной"
служебные_строки:
  примечание: "строки, которые не являются товаром; исключаются из поиска аналогов целиком"
  категории:
    - имя: "служебная: перевозка"
      триггеры: ["cвыше 200 км", "перевозка грузов", "перевозка длинномерных", "перевозка", "свыше 200 км"]
      строк_в_базе: 37
      пример: {строка: 4, текст: "Перевозка длинномерных грузов I класса трубоплетевозом грузоподъемностью 12 т на расстояние до 7 км"}
    - имя: "служебная: погрузка/разгрузка"
      триггеры: ["погрузка при автомобильных", "погрузка", "разгрузка"]
      строк_в_базе: 56
      пример: {строка: 59, текст: "Погрузка при автомобильных перевозках прочих материалов, деталей (с использованием погрузчика)(Провод АС400/51,Трос 11,0-МЗ-В-ОЖ-МК-Н-Р)"}
    - имя: "служебная: надбавка/доплата"
      триггеры: ["надбавка", "доплата", "фссц"]
      строк_в_базе: 11
      пример: {строка: 303, текст: "ФССЦ 81-01-2001 Приложение1.Доплата к цене на сталь марки С345 -3%"}
    - имя: "служебная: ресурсы (вода, энергия, топливо)"
      триггеры: ["электроэнергия", "вода", "топливо дизельное", "горячее оцинкование"]
      строк_в_базе: 4
      пример: {строка: 1286, текст: "Электроэнергия"}
