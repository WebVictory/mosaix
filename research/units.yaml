версия: 1
примечание: "Правило: величины разных измерений не переводятся друг в друга. Переводятся только кратные единицы одной величины. Написания - как в базе (после нижнего регистра и ё -> е)."
величины:
  - величина: "площадь сечения жилы, провода, экрана"
    базовая_единица: "мм²"
    написания: ["мм2", "мм²", "кв.мм", "кв. мм", "мм кв", "sq mm"]
    кратные: []
    пример: {строка: 104, текст: "Кабель силовой ВБШвнг(А)-LS-0,66 4х2,5мм2 с медными жилами"}
    ловушка: "мм² (сечение) и м² (площадь поверхности, кг/м2 у мастик и окраски) - разные величины; 'м2' без 'м' перед ним не сечение"
  - величина: "площадь поверхности"
    базовая_единица: "м²"
    написания: ["м2", "м²", "кв.м"]
    кратные: []
    пример: {строка: 1856, текст: "Блок дверной стальной внутренний однопольный ДСВ, площадь 2,1 м2"}
    ловушка: "у дверей и окон площадь в м2 - производная от размера проема; в нормах расхода 'кг/м2' у мастик - не характеристика товара"
  - величина: "длина, размер, диаметр"
    базовая_единица: "мм"
    написания: ["мм", "м", "см", "L=3000", "L3000", "D=", "d=", "д.", "диаметр", "Ду", "DN", "Dn"]
    кратные: [{единица: "м", множитель: 1000}, {единица: "см", множитель: 10}]
    пример: {строка: 9, текст: "Лоток листовой перфорированный, L=3000 мм «Стандарт LPS 100х200»"}
    ловушка: "Ду/DN (условный проход) не равен наружному диаметру: ВГП Ду50 имеет наружный диаметр около 60 мм; у ПЭ труб в базе 'диаметр 63 мм (Ду=50мм)' - это два разных числа одного изделия (строка 158)"
  - величина: "напряжение"
    базовая_единица: "кВ"
    написания: ["кВ", "кв", "В", "в", "V", "-660", "-1000", "-0,66", "-1,0", "Uн=", "Un~", "Un=~"]
    кратные: [{единица: "В", множитель: 0.001}]
    пример: {строка: 1624, текст: "Кабель силовой с медными жилами ВВГнг(A)-LS 3х1,5-660"}
    ловушка: "0,66 кВ = 660 В, 1 кВ = 1000 В; суффикс '-660' или '-1000' в марке кабеля - напряжение в вольтах, '-10' у кабелей СПЭ и ААБл - в киловольтах; '220 кВ' в имени объекта (КВЛ 220 кВ) не характеристика изделия"
  - величина: "ток"
    базовая_единица: "А"
    написания: ["А", "A", "Iн=", "Iном=", "кА"]
    кратные: [{единица: "кА", множитель: 1000}]
    пример: {строка: 205, текст: "Разъединитель однополюсный Uн=10 кВ, Iн=630 А"}
    ловушка: "кириллическая 'А' в конце числа может быть частью марки (РЛНД-1-10/630 - ток без единицы); 'Ач' - емкость, не ток"
  - величина: "полная мощность"
    базовая_единица: "кВА"
    написания: ["кВА", "кВ·А", "ква", "МВА", "ВА", "VA"]
    кратные: [{единица: "МВА", множитель: 1000}, {единица: "ВА", множитель: 0.001}]
    пример: {строка: 1877, текст: "ТСЗ-1250/11-У1 ... мощностью 1250 кВА"}
    ловушка: "кВА не переводится в кВт без коэффициента мощности; в строке 2219 'Рн=500 кВт (625 кВА)' - это два значения, а не дубль. Число в коде трансформатора (ТДТН-25000) - мощность в кВА без единицы"
  - величина: "активная мощность"
    базовая_единица: "кВт"
    написания: ["кВт", "Вт", "Pn=", "Рн=", "W"]
    кратные: [{единица: "Вт", множитель: 0.001}, {единица: "МВт", множитель: 1000}]
    пример: {строка: 495, текст: "Светильник светодиодный Un~220В, Pn=21Вт, IP66"}
    ловушка: "кВт и кВА не взаимозаменяемы; 'Вт/м' - линейная мощность греющего кабеля, отдельная величина"
  - величина: "реактивная мощность"
    базовая_единица: "квар"
    написания: ["квар", "кВАр"]
    кратные: []
    пример: null
    ловушка: "в базе не встречается; не путать с кВА"
  - величина: "разрешение видеокамеры"
    базовая_единица: "Мп"
    написания: ["Мп", "МП", "Mp", "MP", "мегапиксель", "1080p", "HDTV 1080"]
    кратные: []
    эквиваленты: [{написание: "1080p", значение: 2}, {написание: "HDTV 1080", значение: 2}, {написание: "4K", значение: 8}]
    пример: {строка: 480, текст: "Видеокамера уличная поворотная 2Мп, HDTV 1080, 40-кратный оптический зум"}
    ловушка: "'Мп' - не мегапаскаль (МПа); 1080p - около 2 Мп (1920x1080), это не отдельное значение"
  - величина: "давление"
    базовая_единица: "МПа"
    написания: ["МПа", "Ру", "PN", "кгс/см2", "бар"]
    кратные: [{единица: "кгс/см2", множитель: 0.0981}, {единица: "бар", множитель: 0.1}]
    пример: {строка: 516, текст: "Отвод 90° \"Альфа\" ПЭ 100 SDR 11 Ду100 Ру16"}
    ловушка: "Ру16 - номинальное давление 16 кгс/см2 = 1,6 МПа, не 16 МПа"
  - величина: "механическая нагрузка"
    базовая_единица: "кН"
    написания: ["кН", "Н", "тс", "т"]
    кратные: [{единица: "Н", множитель: 0.001}, {единица: "тс", множитель: 9.81}]
    пример: {строка: 88, текст: "Звено промежуточное монтажное ПТМ-7-3"}
    ловушка: "в кодах сцепной арматуры число (7, 12, 16) - нагрузка в тс (70, 120, 160 кН); у изоляторов ПС70Е число уже в кН. 'т' в скобках фундамента (6,3 т) - масса, не нагрузка"
  - величина: "масса"
    базовая_единица: "кг"
    написания: ["кг", "т"]
    кратные: [{единица: "т", множитель: 1000}]
    пример: {строка: 2038, текст: "Сборные фундаменты под промежуточные опоры ФПС 6-2 (4.48 м3; 6.3 т)"}
    ловушка: "в огнетушителях число в марке (ОП-5) - масса заряда в кг; 'кг/м2' - расход, не масса"
  - величина: "объем"
    базовая_единица: "м³"
    написания: ["м3", "м³", "л"]
    кратные: [{единица: "л", множитель: 0.001}]
    пример: {строка: 559, текст: "ФБС12-4-3-Т, бетон В7,5 (М100, объем 0,127 м3"}
    ловушка: "у модулей пожаротушения 'л' - вместимость сосуда, не объем ОТВ"
  - величина: "емкость аккумулятора"
    базовая_единица: "А·ч"
    написания: ["Ач", "А/ч", "А*ч", "Ah", "А ч"]
    кратные: []
    пример: {строка: 1200, текст: "Аккумулятор герметичный свинцово-кислотный 17 А/ч. АБ 1217С"}
    ловушка: "'А/ч' в базе - ошибочное написание А·ч; в строке 1962 'Аккумулятор 7 А/Ч DTM1240' текст расходится с кодом модели (DTM1240 - 12 В 40 А·ч по каталогу Delta), нужен флаг конфликта"
  - величина: "степень защиты оболочки"
    базовая_единица: "код IP"
    написания: ["IP54", "IP 54", "ip54", "IP66/IP67"]
    кратные: []
    тип: "код, не число"
    правило: "первая цифра - твердые тела (0-6), вторая - вода (0-9); сравнение не_хуже по каждой цифре отдельно; IP66/IP67 - двойная маркировка, считается выполнение обеих; IP67 не всегда лучше IP66 (струи воды)"
    пример: {строка: 331, текст: "Светильник светодиодный Un=~220B, Pn=300 Вт, IP66"}
    ловушка: "не превращать в число 54 или 66 и не сравнивать как число целиком"
  - величина: "предел огнестойкости"
    базовая_единица: "мин"
    написания: ["EI 60", "EI60", "EL60", "ОЗ-60", "ДПМ-01/30"]
    кратные: []
    тип: "код с числом минут"
    пример: {строка: 2078, текст: "Клапаны противопожарные ... предел огнестойкости EI 60"}
    ловушка: "буквы (E, I, W, S) - критерии; сравнивать и число, и набор букв"
  - величина: "цветовая температура"
    базовая_единица: "K"
    написания: ["4000K", "4000 К", "850 (код)"]
    кратные: []
    пример: {строка: 495, текст: "FWL 31-21-850-С120"}
    ловушка: "код 850 в артикуле светильника - индекс цветопередачи 8x и 5000 K, не мощность и не размер"
  - величина: "холодопроизводительность"
    базовая_единица: "кВт"
    написания: ["кВт"]
    кратные: []
    пример: null
    ловушка: "в базе в наименованиях VRF не указана, только индекс модели"
  - величина: "разрушающая нагрузка оптического кабеля"
    базовая_единица: "кН"
    написания: ["кН", "-25кН", "-81кН"]
    кратные: []
    пример: {строка: 1164, текст: "Волоконно-оптический кабель (ОКСН) на 54 ОВ диаметром 13,9 мм ДПТ-П-54У (4х12)(1х6)-25кН"}
    ловушка: "36кА2с у ОКГТ (строка 1412) - термическая стойкость, не нагрузка"
  - величина: "угол"
    базовая_единица: "°"
    написания: ["°", "град"]
    кратные: []
    пример: {строка: 516, текст: "Отвод 90° \"Альфа\""}
    ловушка: "T95°C - температура, не угол"
  - величина: "температура"
    базовая_единица: "°C"
    написания: ["°C", "°С", "T95°C"]
    кратные: []
    пример: null
    ловушка: "в Ex-маркировке T6, T95°C - температурный класс оболочки"
разделители_размеров:
  символы: ["x", "х", "×", "*", "/"]
  правило: "латинская x, кириллическая х, знак умножения и звездочка равнозначны в размерах и жильности; '/' в марках - разделитель разных величин (АС 240/32, ОПН-220/154, М10/30), смысл зависит от категории"
десятичный_разделитель:
  правило: "запятая и точка равнозначны (1,5 = 1.5); '4.48 м3' и '2,51 м3' в одной категории"
